services:
  backend:
    image: ${ECR_REGISTRY}/devlog-backend:${IMAGE_TAG:-latest}
    container_name: devlog-backend
    restart: unless-stopped
    mem_limit: 700m
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60
        -XX:InitialRAMPercentage=20
        -XX:MaxMetaspaceSize=160m
    expose:
      - "8080"
    networks:
      - devlog
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: ${ECR_REGISTRY}/devlog-nginx:${IMAGE_TAG:-latest}
    container_name: devlog-nginx
    restart: unless-stopped
    mem_limit: 128m
    stop_grace_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - devlog
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:v5.4.0
    mem_limit: 128m
    profiles:
      - tools
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    command:
      - certonly
      - --webroot
      - --webroot-path=/var/www/certbot
      - --domain=${SERVER_NAME}
      - --email=${CERTBOT_EMAIL}
      - --agree-tos
      - --no-eff-email

networks:
  devlog:
    name: devlog

volumes:
  letsencrypt:
  certbot-webroot:
