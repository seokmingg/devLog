spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3307/devlog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: devlog
    password: devlog

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  port: 8080

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-expiration: 30m
    refresh-token-expiration: 14d
    frontend-redirect-url: http://localhost:5173/oauth/callback
    cookie-secure: false
