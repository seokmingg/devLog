services:
  mysql:
    image: mysql:8.0
    container_name: devlog-mysql

    environment:
      MYSQL_DATABASE: devlog
      MYSQL_USER: devlog
      MYSQL_PASSWORD: devlog
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - devlog-mysql-data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devlog-mysql-data: